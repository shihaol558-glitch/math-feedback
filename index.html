<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学课后反馈</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#23384a;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}header{max-width:1120px;margin:38px auto 24px;padding:0 24px}header small{color:#568078;letter-spacing:3px}h1{font-size:28px;margin:10px 0}header p{color:#73818d;font-size:14px}main{max-width:1120px;margin:auto;padding:0 24px 40px;display:grid;grid-template-columns:1fr 1fr;gap:26px}.editor,.report{background:white;border-radius:18px;padding:30px;box-shadow:0 8px 35px #23384a08}.identity{display:flex;align-items:center;gap:14px;margin-bottom:25px}.avatar{background:#e9f1ef;color:#43746a;border-radius:14px;padding:14px;font-weight:bold}.identity strong{font-size:20px}.identity p{margin:5px 0 0;color:#7d8992;font-size:13px}label,.section-label{display:block;font-weight:600;font-size:14px;margin:22px 0 10px}input,textarea{width:100%;border:1px solid #dce3e8;border-radius:9px;padding:12px;font:inherit;background:#fbfcfd;color:inherit}textarea{min-height:112px;resize:vertical;line-height:1.7}input:focus,textarea:focus{outline:2px solid #8bb9ad;outline-offset:1px}.rating{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f3}.rating-name{font-size:14px}.stars{display:flex;gap:3px}.star{border:0;background:none;font-size:29px;color:#ccd4db;cursor:pointer;padding:3px;line-height:1}.star.selected{color:#c79b4d}.star:focus-visible{outline:2px solid #568078;border-radius:4px}.score{display:inline-block;width:45px;font-size:12px;color:#82909a;text-align:right}.actions{display:flex;gap:10px;margin-top:26px}button.action{border:1px solid #dce3e8;border-radius:9px;padding:13px 18px;background:white;color:#23384a;font:inherit;font-size:14px;cursor:pointer}button.primary{background:#315e56;color:white;border-color:#315e56;flex:1}.hint{font-size:12px;color:#87939d;line-height:1.7;margin:12px 0 0}#status{color:#a75834;font-size:13px;min-height:20px;margin-top:10px}.preview-label{font-size:12px;color:#87939d;margin:0 0 15px;letter-spacing:2px}.report{align-self:start;position:sticky;top:24px;border-top:5px solid #315e56;border-radius:5px 5px 14px 14px}.report-head small{font-size:11px;letter-spacing:3px;color:#6b8d84}.report h2{font-size:26px;margin:12px 0 24px}.report-meta{background:#f0f5f4;padding:16px;border-radius:8px;display:flex;justify-content:space-between;gap:10px;font-size:13px;line-height:1.8}.report h3{font-size:15px;margin:28px 0 12px;color:#315e56}.report-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.9;margin:0}.empty{color:#99a4ac}.report-ratings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.report-rating{background:#faf8f3;padding:13px;border-radius:8px;font-size:12px}.report-rating span{display:block;color:#b48a3e;font-size:20px;letter-spacing:2px;margin-top:7px}.report footer{border-top:1px solid #e6ecea;margin-top:32px;padding-top:16px;color:#8b9897;font-size:11px;letter-spacing:1px}@media(max-width:800px){header{margin-top:24px}main{grid-template-columns:1fr;padding:0 16px 30px;gap:20px}.editor,.report{padding:24px}.report{position:static}.stars{gap:0}.star{font-size:27px}}@page{size:A4;margin:18mm}@media print{body{background:white;color:#23384a}body>header,.editor,.preview-label{display:none!important}main{display:block;margin:0;padding:0;max-width:none}.report{position:static;box-shadow:none;border-radius:0;padding:8mm 0 0;border-top:3px solid #315e56}.report-meta,.report-rating{print-color-adjust:exact;-webkit-print-color-adjust:exact}.report h3{break-after:avoid}.report-rating,.report-meta{break-inside:avoid}.report-text{orphans:3;widows:3}.report footer{break-inside:avoid}}
</style>
</head>
<body>
<header><small>MATH · CLASS NOTES</small><h1>数学课后反馈</h1><p>记录课堂中的进步，把学习安排清楚地传递给家长。</p></header>
<main>
<section class="editor" aria-label="填写课后反馈">
<div class="identity"><div class="avatar" id="avatar">数</div><div><strong id="student-heading">学生课后反馈</strong><p>初二 · 数学 · 一对一</p></div></div>
<label for="student">学生姓名（本浏览器记住）</label><input id="student" type="text" maxlength="40" placeholder="首次填写姓名，以后自动带入" autocomplete="off">
<label for="date">上课日期</label><input id="date" type="date" required>
<label for="content">本节课内容</label><textarea id="content" placeholder="例如：一次函数的图像与性质；练习利用图像求交点。"></textarea>
<div class="section-label">课堂表现</div><div id="ratings"></div>
<label for="homework">课后作业安排</label><textarea id="homework" placeholder="填写作业题目、复习内容或完成要求；无作业也可以填写“本次无课后作业”。"></textarea>
<div class="actions"><button class="action" id="preview">预览反馈</button><button class="action primary" id="export">导出 PDF</button></div>
<p class="hint">导出时，在打印窗口选择“另存为 PDF”，关闭“页眉和页脚”。姓名仅保存在本浏览器；课堂内容和评分刷新后会清空。</p><div id="status" role="status" aria-live="polite"></div>
</section>
<div><p class="preview-label">反馈预览</p><article class="report" id="report" aria-label="课后反馈报告">
<div class="report-head"><small>MATHEMATICS · LEARNING FEEDBACK</small><h2>数学课后反馈</h2></div>
<div class="report-meta"><div><strong id="report-student">学生姓名</strong><br>初二数学 · 一对一</div><div>上课日期<br><strong id="report-date"></strong></div></div>
<h3>01 &nbsp; 本节课内容</h3><p class="report-text empty" id="report-content">填写后将在这里显示本节课内容。</p>
<h3>02 &nbsp; 课堂表现</h3><div class="report-ratings" id="report-ratings"></div>
<h3>03 &nbsp; 课后作业安排</h3><p class="report-text empty" id="report-homework">填写后将在这里显示课后安排。</p>
<footer>每一次认真思考，都是进步的开始。</footer>
</article></div>
</main>
<script>
const names=['专注力','互动性','课堂纪律','做题准确率'];const scores=[0,0,0,0];
const date=document.getElementById('date'),content=document.getElementById('content'),homework=document.getElementById('homework'),status=document.getElementById('status');
const student=document.getElementById('student');
try{student.value=localStorage.getItem('math-feedback-student')||''}catch{}
student.addEventListener('input',()=>{try{localStorage.setItem('math-feedback-student',student.value.trim())}catch{}update()});
const now=new Date();date.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
names.forEach((name,i)=>{const row=document.createElement('div');row.className='rating';const label=document.createElement('span');label.className='rating-name';label.textContent=name;row.append(label);const wrap=document.createElement('div');wrap.style.display='flex';wrap.style.alignItems='center';const stars=document.createElement('div');stars.className='stars';stars.setAttribute('role','group');stars.setAttribute('aria-label',name);for(let n=1;n<=5;n++){const b=document.createElement('button');b.type='button';b.className='star';b.textContent='★';b.setAttribute('aria-label',`${name} ${n}颗星`);b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{scores[i]=n;[...stars.children].forEach((el,j)=>{el.classList.toggle('selected',j<n);el.setAttribute('aria-pressed',String(j+1===n))});value.textContent=`${n} / 5`;update()});stars.append(b)}const value=document.createElement('span');value.className='score';value.textContent='未评';wrap.append(stars,value);row.append(wrap);document.getElementById('ratings').append(row)});
function update(){document.getElementById('student-heading').textContent=student.value.trim()||'学生课后反馈';document.getElementById('report-student').textContent=student.value.trim()||'学生姓名';document.getElementById('avatar').textContent=student.value.trim().slice(0,1)||'数';document.getElementById('report-date').textContent=date.value?date.value.replaceAll('-',' / '):'请选择日期';for(const [id,input,placeholder] of [['report-content',content,'填写后将在这里显示本节课内容。'],['report-homework',homework,'填写后将在这里显示课后安排。']]){const el=document.getElementById(id);el.textContent=input.value.trim()||placeholder;el.classList.toggle('empty',!input.value.trim())}const list=document.getElementById('report-ratings');list.replaceChildren();names.forEach((name,i)=>{const item=document.createElement('div');item.className='report-rating';item.textContent=name;const stars=document.createElement('span');stars.textContent=scores[i]?'★'.repeat(scores[i])+'☆'.repeat(5-scores[i]):'尚未评分';stars.setAttribute('aria-label',scores[i]?`${scores[i]}颗星，满分5颗星`:'尚未评分');item.append(stars);list.append(item)})}
function validate(){if(!student.value.trim()){status.textContent='请填写学生姓名。';student.focus();return false}if(!date.value){status.textContent='请选择上课日期。';date.focus();return false}if(!content.value.trim()){status.textContent='请填写本节课内容。';content.focus();return false}const missing=names.filter((_,i)=>!scores[i]);if(missing.length){status.textContent=`请完成评分：${missing.join('、')}。`;return false}if(!homework.value.trim()){status.textContent='请填写课后作业安排；没有作业可填写“本次无课后作业”。';homework.focus();return false}status.textContent='';return true}
[date,content,homework].forEach(el=>el.addEventListener('input',update));document.getElementById('preview').addEventListener('click',()=>{update();document.getElementById('report').scrollIntoView({behavior:'smooth',block:'start'})});document.getElementById('export').addEventListener('click',()=>{if(!validate())return;update();document.title=`${student.value.trim()}-数学课后反馈-${date.value}`;window.print()});update();
</script>
</body>
</html>
